<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESO Logs Recent Reports</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f5f8fb;
      color: #1f2937;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
      font-size: 1.35rem;
    }

    .small {
      color: #4b5563;
      font-size: 0.92rem;
    }

    .status {
      margin: 10px 0 14px;
      padding: 10px;
      border-radius: 6px;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      font-family: Consolas, "Courier New", monospace;
      white-space: pre-wrap;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    label {
      font-weight: 600;
    }

    input[type="number"] {
      width: 140px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 9px 14px;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .meta {
      margin: 8px 0 12px;
      color: #334155;
      font-size: 0.92rem;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
      font-size: 0.92rem;
    }

    th,
    td {
      border-bottom: 1px solid #e5e7eb;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
      font-weight: 700;
    }

    code {
      background: #f3f4f6;
      padding: 0 4px;
      border-radius: 4px;
    }

    a.report-link {
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 600;
    }

    a.report-link:hover {
      text-decoration: underline;
    }

    .title-main {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .title-sub {
      font-size: 0.85rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Recent ESO Logs (POC)</h1>
    <p class="small">Loads config from <code>config.local.js</code> at repo root and fetches the 50 most recent reports for the selected user.</p>

    <div id="status" class="status">Loading configuration...</div>

    <div class="controls">
      <label for="userIdInput">User ID</label>
      <input id="userIdInput" type="number" min="1" step="1" value="34336" />
      <button id="runButton" type="button">Load Recent Logs</button>
    </div>

    <div id="meta" class="meta">No request executed yet.</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Start</th>
            <th>End</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script
    src="../config.local.js"
    onerror="document.getElementById('status').textContent='Config load error: could not load ../config.local.js. If serving only sandbox, change server root to the repository root.'"
  ></script>
  <script>
    const statusEl = document.getElementById("status");
    const metaEl = document.getElementById("meta");
    const rowsEl = document.getElementById("rows");
    const userIdInputEl = document.getElementById("userIdInput");
    const runButtonEl = document.getElementById("runButton");

    const PLACEHOLDER_TOKENS = new Set(["REPLACE_WITH_ACCESS_TOKEN", "YOUR_ACCESS_TOKEN"]);
    const PLACEHOLDER_CLIENTS = new Set(["REPLACE_WITH_CLIENT_ID", "YOUR_CLIENT_ID", "REPLACE_WITH_CLIENT_SECRET", "YOUR_CLIENT_SECRET"]);

    const DEFAULT_API_URL = "https://www.esologs.com/api/v2/client";
    const DEFAULT_OAUTH_URL = "https://www.esologs.com/oauth/token";
    const LIMIT = 50;

    const query = `
      query RecentLogs($userID: Int!, $limit: Int!, $page: Int!) {
        reportData {
          reports(userID: $userID, limit: $limit, page: $page) {
            total
            current_page
            per_page
            has_more_pages
            data {
              code
              title
              startTime
              endTime
            }
          }
        }
      }
    `;

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function formatTime(ms) {
      if (!ms) {
        return "-";
      }
      const d = new Date(ms);
      if (Number.isNaN(d.getTime())) {
        return "-";
      }
      return d.toLocaleString();
    }

    function loadConfig() {
      const config = window.ESOLOGS_LOCAL_CONFIG;
      if (!config) {
        throw new Error("Missing window.ESOLOGS_LOCAL_CONFIG. Check config.local.js");
      }

      config.apiUrl = config.apiUrl || DEFAULT_API_URL;
      config.oauthUrl = config.oauthUrl || DEFAULT_OAUTH_URL;
      config.tokenType = config.tokenType || "Bearer";

      const hasAccessToken = Boolean(config.accessToken) && !PLACEHOLDER_TOKENS.has(config.accessToken);
      const hasClientCredentials = Boolean(config.clientId)
        && Boolean(config.clientSecret)
        && !PLACEHOLDER_CLIENTS.has(config.clientId)
        && !PLACEHOLDER_CLIENTS.has(config.clientSecret);

      if (!hasAccessToken && !hasClientCredentials) {
        throw new Error("Provide either accessToken or both clientId and clientSecret in config.local.js");
      }

      config.hasAccessToken = hasAccessToken;
      config.hasClientCredentials = hasClientCredentials;
      return config;
    }

    async function fetchAccessToken(config) {
      const body = new URLSearchParams({
        grant_type: "client_credentials",
        client_id: config.clientId,
        client_secret: config.clientSecret
      });

      const response = await fetch(config.oauthUrl, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body
      });

      const raw = await response.text();
      let data;

      try {
        data = JSON.parse(raw);
      } catch {
        data = { raw };
      }

      if (!response.ok || !data.access_token) {
        throw new Error(`OAuth request failed (${response.status}): ${JSON.stringify(data, null, 2)}`);
      }

      config.accessToken = data.access_token;
      config.tokenType = data.token_type || config.tokenType || "Bearer";
      config.hasAccessToken = true;
      return config.accessToken;
    }

    async function resolveAccessToken(config) {
      if (config.hasAccessToken) {
        return config.accessToken;
      }

      if (!config.hasClientCredentials) {
        throw new Error("No usable access token or client credentials available.");
      }

      setStatus("Acquiring access token...");
      return fetchAccessToken(config);
    }

    async function fetchRecentLogs(config, userId) {
      const accessToken = await resolveAccessToken(config);
      const response = await fetch(config.apiUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `${config.tokenType} ${accessToken}`
        },
        body: JSON.stringify({
          query,
          variables: {
            userID: userId,
            limit: LIMIT,
            page: 1
          }
        })
      });

      const raw = await response.text();
      let payload;
      try {
        payload = JSON.parse(raw);
      } catch {
        payload = { raw };
      }

      if (!response.ok || payload.errors) {
        throw new Error(`GraphQL request failed (${response.status}): ${JSON.stringify(payload, null, 2)}`);
      }

      return ((payload.data || {}).reportData || {}).reports || {};
    }

    function renderRows(reports) {
      rowsEl.innerHTML = "";
      for (const r of reports) {
        const tr = document.createElement("tr");
        const reportCode = r.code || "";
        const reportUrl = reportCode ? `https://www.esologs.com/reports/${reportCode}` : "";
        const reportCell = reportCode
          ? `<a class="report-link" href="${reportUrl}" target="_blank" rel="noopener noreferrer">Link</a>`
          : "-";
        tr.innerHTML = `
          <td>
            <div class="title-main">${r.title || "-"}</div>
            <div class="title-sub">${reportCell}</div>
          </td>
          <td>${formatTime(r.startTime)}</td>
          <td>${formatTime(r.endTime)}</td>
        `;
        rowsEl.appendChild(tr);
      }
    }

    function init() {
      let config;
      try {
        config = loadConfig();
      } catch (error) {
        setStatus(`Config error: ${error.message}`);
        runButtonEl.disabled = true;
        return;
      }

      setStatus("Configuration loaded. Click 'Load Recent Logs' to run.");

      runButtonEl.addEventListener("click", async () => {
        const userId = Number.parseInt(userIdInputEl.value, 10);
        if (!Number.isFinite(userId) || userId <= 0) {
          setStatus("Invalid user ID. Enter a positive integer.");
          return;
        }

        runButtonEl.disabled = true;
        setStatus("Running query...");
        metaEl.textContent = "Loading...";

        try {
          const reportsBlock = await fetchRecentLogs(config, userId);
          const rows = Array.isArray(reportsBlock.data) ? reportsBlock.data.slice() : [];
          rows.sort((a, b) => (b.startTime || 0) - (a.startTime || 0));
          renderRows(rows);

          metaEl.textContent = `userId=${userId} requested=${LIMIT} returned=${rows.length} total=${reportsBlock.total} page=${reportsBlock.current_page} per_page=${reportsBlock.per_page} has_more_pages=${reportsBlock.has_more_pages}`;
          setStatus("Request completed.");
        } catch (error) {
          rowsEl.innerHTML = "";
          metaEl.textContent = "Request failed.";
          setStatus(error.message || String(error));
        } finally {
          runButtonEl.disabled = false;
        }
      });
    }

    try {
      init();
    } catch (error) {
      setStatus(`Startup error: ${error.message || String(error)}`);
      runButtonEl.disabled = true;
    }
  </script>
</body>
</html>
