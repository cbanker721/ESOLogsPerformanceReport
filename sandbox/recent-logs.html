<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESO Logs Recent Reports</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f5f8fb;
      color: #1f2937;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
      font-size: 1.35rem;
    }

    .small {
      color: #4b5563;
      font-size: 0.92rem;
    }

    .status {
      margin: 10px 0 14px;
      padding: 10px;
      border-radius: 6px;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      font-family: Consolas, "Courier New", monospace;
      white-space: pre-wrap;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    label {
      font-weight: 600;
    }

    input[type="number"] {
      width: 140px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 9px 14px;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .meta {
      margin: 8px 0 12px;
      color: #334155;
      font-size: 0.92rem;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
      font-size: 0.92rem;
    }

    th,
    td {
      border-bottom: 1px solid #e5e7eb;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
      font-weight: 700;
    }

    code {
      background: #f3f4f6;
      padding: 0 4px;
      border-radius: 4px;
    }

    a.report-link {
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 600;
    }

    a.report-link:hover {
      text-decoration: underline;
    }

    .title-main {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .title-sub {
      font-size: 0.85rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Recent ESO Logs (POC)</h1>
    <p class="small">Loads config from <code>config.local.js</code> at repo root and fetches the 50 most recent reports for the selected user.</p>

    <div id="status" class="status">Loading configuration...</div>

    <div class="controls">
      <label for="userIdInput">User ID</label>
      <input id="userIdInput" type="number" min="1" step="1" value="34336" />
      <button id="runButton" type="button">Load Recent Logs</button>
    </div>

    <div id="meta" class="meta">No request executed yet.</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Start</th>
            <th>End</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script
    src="../config.local.js"
    onerror="document.getElementById('status').textContent='Config load error: could not load ../config.local.js. If serving only sandbox, change server root to the repository root.'"
  ></script>
  <script src="./esologs-domain.js"></script>
  <script src="./esologs-client.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const metaEl = document.getElementById("meta");
    const rowsEl = document.getElementById("rows");
    const userIdInputEl = document.getElementById("userIdInput");
    const runButtonEl = document.getElementById("runButton");

    const LIMIT = 50;

    const query = `
      query RecentLogs($userID: Int!, $limit: Int!, $page: Int!) {
        reportData {
          reports(userID: $userID, limit: $limit, page: $page) {
            total
            current_page
            per_page
            has_more_pages
            data {
              code
              title
              startTime
              endTime
            }
          }
        }
      }
    `;

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function getUserIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("userId") || "";
    }

    function setUrlUserId(userId) {
      const url = new URL(window.location.href);
      url.searchParams.set("userId", String(userId));
      history.replaceState({}, "", url);
    }

    async function fetchRecentLogs(config, userId) {
      const payload = await window.ESOLogsClient.query(
        config,
        query,
        {
          userID: userId,
          limit: LIMIT,
          page: 1
        },
        setStatus
      );

      return ((payload.data || {}).reportData || {}).reports || {};
    }

    function renderRows(reports) {
      rowsEl.innerHTML = "";
      const userId = Number.parseInt(userIdInputEl.value, 10);
      for (const r of reports) {
        const tr = document.createElement("tr");
        const externalCell = r.externalReportUrl
          ? `<a class="report-link" href="${r.externalReportUrl}" target="_blank" rel="noopener noreferrer">Link</a>`
          : "-";
        const localReportUrl = r.code
          ? `./report.html?code=${encodeURIComponent(r.code)}${Number.isFinite(userId) && userId > 0 ? `&userId=${encodeURIComponent(userId)}` : ""}`
          : "";
        const localCell = localReportUrl
          ? `<a class="report-link" href="${localReportUrl}">Open</a>`
          : "-";
        tr.innerHTML = `
          <td>
            <div class="title-main">${r.title || "-"}</div>
            <div class="title-sub">${externalCell}</div>
          </td>
          <td>${r.startTimeText}</td>
          <td>${r.endTimeText}</td>
          <td>${localCell}</td>
        `;
        rowsEl.appendChild(tr);
      }
    }

    function init() {
      let config;
      try {
        config = window.ESOLogsClient.loadConfig();
      } catch (error) {
        setStatus(`Config error: ${error.message}`);
        runButtonEl.disabled = true;
        return;
      }

      const initialUserId = getUserIdFromUrl();
      if (initialUserId) {
        userIdInputEl.value = initialUserId;
      }

      setStatus("Configuration loaded. Click 'Load Recent Logs' to run.");

      runButtonEl.addEventListener("click", async () => {
        const userId = Number.parseInt(userIdInputEl.value, 10);
        if (!Number.isFinite(userId) || userId <= 0) {
          setStatus("Invalid user ID. Enter a positive integer.");
          return;
        }

        runButtonEl.disabled = true;
        setStatus("Running query...");
        metaEl.textContent = "Loading...";

        try {
          const reportsBlock = await fetchRecentLogs(config, userId);
          const list = window.ESOLogsDomain.reportListFromApi(reportsBlock);
          const rows = list.reports.slice();
          rows.sort((a, b) => (b.startTime || 0) - (a.startTime || 0));
          renderRows(rows);
          setUrlUserId(userId);

          metaEl.textContent = `userId=${userId} requested=${LIMIT} returned=${rows.length} total=${list.total} page=${list.currentPage} per_page=${list.perPage} has_more_pages=${list.hasMorePages}`;
          setStatus("Request completed.");
        } catch (error) {
          rowsEl.innerHTML = "";
          metaEl.textContent = "Request failed.";
          setStatus(error.message || String(error));
        } finally {
          runButtonEl.disabled = false;
        }
      });

      if (initialUserId) {
        runButtonEl.click();
      }
    }

    try {
      init();
    } catch (error) {
      setStatus(`Startup error: ${error.message || String(error)}`);
      runButtonEl.disabled = true;
    }
  </script>
</body>
</html>
